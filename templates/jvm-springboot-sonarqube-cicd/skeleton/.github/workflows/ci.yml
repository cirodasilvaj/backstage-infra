name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  qa-and-security:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test with Maven
        run: mvn clean verify

      - name: SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}
          SONAR_HOST_URL: ${{ '${{ secrets.SONAR_HOST_URL }}' }}
        with:
          args: >
            -Dsonar.projectKey=${{ values.component_id }}
            -Dsonar.projectName=${{ values.component_id }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}

  build-and-deploy:
    name: Build Container & Provision ArgoCD / Grafana
    needs: qa-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ values.destinationOwner }}/${{ values.component_id }}:latest
            ghcr.io/${{ values.destinationOwner }}/${{ values.component_id }}:${{ '${{ github.sha }}' }}

      - name: Provision Service Dashboard in Grafana (Dashboard-as-Code)
        env:
          GRAFANA_URL: ${{ '${{ secrets.GRAFANA_URL }}' }}
          GRAFANA_USER: ${{ "${{ secrets.GRAFANA_USER || 'admin' }}" }}
          GRAFANA_PASSWORD: ${{ "${{ secrets.GRAFANA_PASSWORD || 'Grafana@2026' }}" }}
        run: |
          if [ -n "${GRAFANA_URL}" ]; then
            echo "📊 Provisioning ${{ values.component_id }} Grafana Dashboard..."
            curl -fsS -u "${GRAFANA_USER}:${GRAFANA_PASSWORD}" \
              -X POST "${GRAFANA_URL}/api/dashboards/db" \
              -H "Content-Type: application/json" \
              -d @grafana/dashboard.json || echo "Grafana API unreachable or already provisioned."
          fi

      - name: Register / Sync ArgoCD Application
        run: |
          echo "🚀 Quality Gate approved and container image published!"
          echo "ArgoCD Application manifest ready at k8s/argo-application.yaml"
