# The image below is a placeholder. Backstage has no generic public image —
# every installation scaffolds and builds its own app with
# `npx @backstage/create-app`, then builds/pushes a container image from it.
# Point `image` at that image (e.g. the ECR/GHCR repo your app gets built
# into) before ArgoCD can actually bring this Deployment up healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage-auth-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 7007
          volumeMounts:
            - name: app-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: app-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: basic-auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: backstage
          image: roadiehq/community-backstage-image:latest
          env:
            - name: GITHUB_TOKEN
              value: "demo-placeholder-token"
          ports:
            - containerPort: 7000
      volumes:
        - name: app-config
          configMap:
            name: backstage-app-config
        - name: basic-auth
          secret:
            secretName: backstage-basic-auth
