name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "k8s-manifests/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "us-east-1"

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-backstate-infra
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Same pattern as kube-demo-2026/_terraform.yml: a per-account S3
      # bucket with native locking, created on first use, so state is
      # actually persisted between runs instead of starting from scratch.
      - name: Ensure state bucket
        working-directory: .
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="backstate-infra-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket ${BUCKET} already exists."
          else
            echo "Creating state bucket ${BUCKET} ..."
            aws s3api create-bucket --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=backstate-infra/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform ${{ github.event.inputs.action || 'plan' }}
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.action || 'plan' }}" in
            plan)
              terraform plan -input=false ;;
            apply)
              terraform apply -input=false -auto-approve ;;
            destroy)
              terraform destroy -input=false -auto-approve ;;
            *)
              echo "unknown action: ${{ github.event.inputs.action }}" >&2; exit 1 ;;
          esac
