name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa-and-security:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Python QA Unit Tests & Coverage
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Pytest & Coverage XML
        run: |
          pip install -r requirements.txt
          pytest test_app.py -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}
          SONAR_HOST_URL: ${{ '${{ secrets.SONAR_HOST_URL }}' }}
        with:
          args: >
            -Dsonar.projectKey=${{ values.component_id }}
            -Dsonar.projectName=${{ values.component_id }}
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}

  deploy:
    name: Deploy to Kubernetes
    needs: qa-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Step
        run: echo "Quality Gate approved! Starting deployment of ${{ values.component_id }}..."
