apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-sonarqube-cicd-template
  title: .NET 8 C# Web App + CI/CD com QA & SonarQube Security Gate
  description: >-
    Skeleton completo de aplicação .NET 8 C# Minimal API com testes automatizados (dotnet test + Cobertura),
    análise estática de qualidade e segurança no SonarQube (dotnet-sonarscanner + Roslyn Security + OWASP),
    build de container para GHCR e manifesto GitOps para deploy via ArgoCD no EKS.
  tags:
    - dotnet
    - csharp
    - sonarqube
    - qa
    - devsecops
    - github-actions
    - eks
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Identificação do Serviço
      required:
        - component_id
        - description
      properties:
        component_id:
          title: Nome da Aplicação
          type: string
          description: Identificador único do microsserviço (ex. pedidos-dotnet-api)
          default: dotnet-csharp-app-demo
        description:
          title: Descrição
          type: string
          description: Breve descrição do serviço
          default: Aplicação .NET 8 C# com pipeline CI/CD integrado ao SonarQube QA & Security
        sonar_host_url:
          title: URL do SonarQube no Cluster EKS
          type: string
          default: http://sonarqube.sonarqube.svc.cluster.local:9000
  steps:
    - id: fetch-base
      name: Gerar Skeleton .NET 8 C# com Pipeline CI/CD + SonarQube QA
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          sonar_host_url: ${{ parameters.sonar_host_url }}

    - id: publish
      name: Publicar Repositório no GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=cirodasilvaj&repo=${{ parameters.component_id }}
        defaultBranch: main

    - id: register
      name: Registrar Componente no Catálogo do Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repositório no GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Abrir no Catálogo do Backstage
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
