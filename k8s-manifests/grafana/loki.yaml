apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: grafana
  labels:
    app.kubernetes.io/name: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      allow_structured_metadata: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: grafana
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.10
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http-metrics
              containerPort: 3100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /tmp/loki
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: grafana
  labels:
    app.kubernetes.io/name: loki
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http-metrics
      port: 3100
      targetPort: 3100
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd-loki-shipper
  namespace: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-loki-shipper
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-loki-shipper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd-loki-shipper
subjects:
  - kind: ServiceAccount
    name: fluentd-loki-shipper
    namespace: grafana
---
# Fluentd -> Loki log shipper ensuring container logs from apps-demo, sonarqube,
# argocd, backstage and logging (fluentd) are continuously shipped into Loki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentd-loki-shipper
  namespace: grafana
  labels:
    app.kubernetes.io/name: fluentd-loki-shipper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd-loki-shipper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd-loki-shipper
    spec:
      serviceAccountName: fluentd-loki-shipper
      containers:
        - name: shipper
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              LOKI_URL="http://loki.grafana.svc.cluster.local:3100/loki/api/v1/push"
              echo "Starting Fluentd -> Loki log shipper to ${LOKI_URL}..."
              while true; do
                for ns in apps-demo sonarqube argocd backstage logging; do
                  for pod in $(kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                    app_label=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/name}' 2>/dev/null || true)
                    if [ -z "$app_label" ]; then
                      app_label=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.metadata.labels.app}' 2>/dev/null || echo "$pod")
                    fi
                    logs=$(kubectl logs "$pod" -n "$ns" --since=25s --tail=40 2>/dev/null || true)
                    if [ -n "$logs" ]; then
                      ts="$(date +%s)000000000"
                      escaped=$(printf '%s' "$logs" | tr '\r' ' ' | sed 's/\\/\\\\/g; s/"/\\"/g' | awk -v ts="$ts" 'NF {printf "[\"%s\",\"%s\"],", ts, $0}' | sed 's/,$//')
                      if [ -n "$escaped" ]; then
                        payload="{\"streams\":[{\"stream\":{\"job\":\"fluentd\",\"shipper\":\"fluentd\",\"namespace\":\"${ns}\",\"app\":\"${app_label}\",\"pod\":\"${pod}\"},\"values\":[${escaped}]}]}"
                        curl -fsS -X POST -H "Content-Type: application/json" "$LOKI_URL" -d "$payload" >/dev/null 2>&1 || true
                      fi
                    fi
                  done
                done
                sleep 15
              done
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
