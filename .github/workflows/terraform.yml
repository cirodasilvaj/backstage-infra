name: terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "k8s-manifests/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "k8s-manifests/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: apply

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-backstage-infra
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Ensure state bucket
        working-directory: .
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="backstage-infra-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket ${BUCKET} already exists."
          else
            echo "Creating state bucket ${BUCKET} ..."
            aws s3api create-bucket --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          aws s3 rm "s3://${BUCKET}/backstage-infra/terraform.tfstate.tflock" 2>/dev/null || true

      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=backstage-infra/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Pre-install ArgoCD CRDs and ensure backstage namespace
        run: |
          aws eks update-kubeconfig --name "kube-demo-eks" --region "${AWS_REGION}"
          kubectl apply -k https://github.com/argoproj/argo-cd/manifests/crds\?ref=v2.12.3
          for crd in applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io; do
            kubectl label crd "$crd" app.kubernetes.io/managed-by=Helm --overwrite || true
            kubectl annotate crd "$crd" meta.helm.sh/release-name=argocd meta.helm.sh/release-namespace=argocd --overwrite || true
          done
          kubectl create namespace backstage --dry-run=client -o yaml | kubectl apply -f -

      - name: Terraform validate
        run: terraform validate

      - name: Terraform run
        run: |
          set -euo pipefail
          ACTION="${{ github.event_name == 'push' && 'apply' || github.event.inputs.action || 'plan' }}"
          case "$ACTION" in
            plan)
              terraform plan -input=false ;;
            apply)
              terraform apply -input=false -auto-approve ;;
            destroy)
              terraform destroy -input=false -auto-approve ;;
            *)
              echo "unknown action: $ACTION" >&2; exit 1 ;;
          esac

      - name: Sync Backstage manifests and show outputs
        if: github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == ''
        run: |
          kubectl apply -f ../k8s-manifests/backstage/
          kubectl rollout restart deployment/backstage -n backstage
          kubectl rollout status deployment/backstage -n backstage --timeout=180s || true
          terraform output
          echo "--- CLUSTER PODS ---"
          kubectl get pods -A
          echo "--- CLUSTER SERVICES ---"
          kubectl get svc -A
        continue-on-error: true
