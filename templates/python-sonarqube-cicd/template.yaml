apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-sonarqube-cicd-template
  title: Python 3.12 Web App + CI/CD with QA & SonarQube Security Gate
  description: >-
    Complete Python (Flask + Gunicorn) application skeleton with automated QA tests (Pytest + Coverage),
    SonarQube static quality and security analysis (SAST + OWASP Dependency-Check),
    GHCR container build, and GitOps manifest for ArgoCD deployment on EKS.
  tags:
    - python
    - flask
    - sonarqube
    - qa
    - devsecops
    - github-actions
    - eks
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service Identification
      required:
        - component_id
        - description
      properties:
        component_id:
          title: Application Name
          type: string
          description: Unique microservice identifier (e.g., payments-python-api)
          default: python-app-demo
        description:
          title: Description
          type: string
          description: Brief description of the service
          default: Python application with CI/CD pipeline integrated with SonarQube QA & Security
        sonar_host_url:
          title: SonarQube URL in EKS Cluster
          type: string
          default: http://sonarqube.sonarqube.svc.cluster.local:9000
  steps:
    - id: fetch-base
      name: Generate Skeleton with CI/CD Pipeline + SonarQube QA
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          sonar_host_url: ${{ parameters.sonar_host_url }}

    - id: publish
      name: Publish Repository to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=cirodasilvaj&repo=${{ parameters.component_id }}
        defaultBranch: main

    - id: register
      name: Register Component in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
