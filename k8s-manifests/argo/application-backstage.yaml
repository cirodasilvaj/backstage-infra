# Rendered by terraform/modules/backstage-app via templatefile().
# Kept as plain YAML (instead of inline HCL) so the GitOps definition stays
# reviewable on its own, the way ArgoCD Application manifests normally are.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: ${argocd_namespace}
spec:
  project: default
  source:
    repoURL: ${repo_url}
    targetRevision: ${target_revision}
    path: ${repo_path}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${app_namespace}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
