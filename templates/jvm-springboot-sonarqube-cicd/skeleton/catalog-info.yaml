apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.component_id }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.destinationOwner }}/${{ values.component_id }}
    backstage.io/techdocs-ref: dir:.
    sonarqube.org/project-key: ${{ values.component_id }}
    backstage.io/kubernetes-id: ${{ values.component_id }}
    backstage.io/kubernetes-namespace: apps-demo
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    fluentd.io/destination: "loki"
    grafana/dashboard-selector: "${{ values.component_id }}"
    grafana/tag-selector: "service:${{ values.component_id }}"
    grafana/overview-dashboard: "http://grafana.992382723408.realhandsonlabs.net/d/${{ values.component_id }}-dashboard"
    argocd/app-name: ${{ values.component_id }}
  tags:
    - microservice
    - k8s
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - argocd
  links:
    - url: https://github.com/${{ values.destinationOwner }}/${{ values.component_id }}
      title: GitHub Source Code
      icon: github
    - url: http://grafana.992382723408.realhandsonlabs.net/d/${{ values.component_id }}-dashboard
      title: Grafana Dashboard
      icon: dashboard
    - url: http://sonarqube.992382723408.realhandsonlabs.net/dashboard?id=${{ values.component_id }}
      title: SonarQube Quality Gate
      icon: check
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: ${{ values.system }}
