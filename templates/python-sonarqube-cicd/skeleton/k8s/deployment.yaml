apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-demo-app
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: python-demo-app
    backstage.io/kubernetes-id: python-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-demo-app
        backstage.io/kubernetes-id: python-demo-app
    spec:
      containers:
        - name: python-demo-app
          image: ghcr.io/cirodasilvaj/apps-demo-2026/python-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
