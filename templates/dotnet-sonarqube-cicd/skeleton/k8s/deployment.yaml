apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-csharp-demo-app
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: dotnet-csharp-demo-app
    backstage.io/kubernetes-id: dotnet-csharp-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dotnet-csharp-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dotnet-csharp-demo-app
        backstage.io/kubernetes-id: dotnet-csharp-demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        fluentd.io/collect: "true"
        fluentd.io/parser: "json"
        fluentd.io/destination: "loki"
    spec:
      containers:
        - name: dotnet-csharp-demo-app
          image: ghcr.io/cirodasilvaj/apps-demo-2026/dotnet-csharp-app:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "dotnet-csharp-demo-app"
            - name: FLUENTD_HOST
              value: "fluentd.logging.svc.cluster.local"
            - name: FLUENTD_PORT
              value: "24224"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-csharp-demo-app
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: dotnet-csharp-demo-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dotnet-csharp-demo-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
