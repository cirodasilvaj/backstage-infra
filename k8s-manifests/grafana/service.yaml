apiVersion: v1
kind: Service
metadata:
  name: grafana-metrics
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana-metrics
    backstage.io/kubernetes-id: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-metrics
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: grafana-3000
      port: 3000
      targetPort: 3000
      protocol: TCP
