name: CI & Quality Gate (JVM Spring Boot)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa-and-security:
    name: Maven Build, JaCoCo & SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Run Unit Tests with JaCoCo Coverage
        run: mvn -B clean verify

      - name: SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}
          SONAR_HOST_URL: ${{ '${{ secrets.SONAR_HOST_URL }}' }}
        with:
          args: >
            -Dsonar.projectKey=${{ values.component_id }}
            -Dsonar.projectName=${{ values.component_id }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ '${{ secrets.SONAR_TOKEN }}' }}

  deploy:
    name: Deploy to Kubernetes
    needs: qa-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Step
        run: echo "Quality Gate approved! Starting deployment of ${{ values.component_id }}..."
