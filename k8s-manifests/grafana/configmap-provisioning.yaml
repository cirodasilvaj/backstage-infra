apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-prometheus-provisioning
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-eks
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 15s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'EKS Prometheus Dashboards'
        orgId: 1
        folder: 'Kubernetes EKS'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
  eks-overview.json: |
    {
      "title": "EKS Cluster & Pods Metrics (Prometheus)",
      "uid": "eks-prometheus-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-eks" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory Working Set by Namespace (Bytes)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-eks" },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Running Pods Count by Namespace",
          "type": "stat",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus-eks" },
          "targets": [
            {
              "expr": "count(kube_pod_info) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
