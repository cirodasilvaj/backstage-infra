apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.component_id }}
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    app.kubernetes.io/instance: ${{ values.component_id }}-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: ${{ values.system }}
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/created-by: backstage-scaffolder
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    source-project: ${{ values.component_id }}
    owner: ${{ values.owner }}
    backstage.io/kubernetes-id: ${{ values.component_id }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.component_id }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.component_id }}
        app.kubernetes.io/instance: ${{ values.component_id }}-prod
        app.kubernetes.io/component: backend-api
        environment: sandbox
        owner: ${{ values.owner }}
        backstage.io/kubernetes-id: ${{ values.component_id }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        fluentd.io/collect: "true"
        fluentd.io/parser: "json"
        fluentd.io/destination: "loki"
    spec:
      containers:
        - name: ${{ values.component_id }}
          image: ghcr.io/${{ values.destinationOwner }}/${{ values.component_id }}:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "${{ values.component_id }}"
            - name: FLUENTD_HOST
              value: "fluentd.logging.svc.cluster.local"
            - name: FLUENTD_PORT
              value: "24224"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.component_id }}
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    app.kubernetes.io/part-of: ${{ values.system }}
    app.kubernetes.io/managed-by: argocd
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    owner: ${{ values.owner }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${{ values.component_id }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
