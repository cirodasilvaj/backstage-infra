apiVersion: backstage.io/v1beta2
kind: Template
metadata:
  name: nodejs-sonarqube-cicd-template
  title: Node.js 20 Web App + CI/CD with SonarQube, Prometheus & Fluentd/Loki
  description: >-
    Creates a complete Node.js 20 microservice repository with automated QA tests,
    SonarQube Quality Gate validation, Prometheus /metrics, Fluentd -> Loki JSON logs, and Backstage manifest.
  tags:
    - node
    - nodejs
    - javascript
    - k8s
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - cicd
spec:
  owner: squad-plataforma
  type: service

  parameters:
    - title: Component Information
      required:
        - component_id
        - owner
        - description
      properties:
        component_id:
          title: Service Name
          type: string
          description: Unique identifier (lowercase letters and hyphens)
          pattern: '^[a-z0-9-]+$'
          default: nodejs-app-demo
        description:
          title: Description
          type: string
          description: What does this Node.js microservice do?
          default: Node.js 20 microservice with SonarQube Quality Gate, Prometheus metrics and Fluentd/Loki logs
        owner:
          title: Responsible Team
          type: string
          description: Squad that owns the application (e.g., squad-checkout)
          default: platform-team
        system:
          title: System / Domain
          type: string
          default: kube-demo-2026

    - title: Git Destination
      required:
        - destinationOwner
        - repository
      properties:
        destinationOwner:
          title: GitHub Owner / Organization
          type: string
          description: GitHub user or organization where the repository will be created
          default: cirodasilvaj
        repository:
          title: GitHub Repository Name
          type: string
          description: Target repository name to create on GitHub
          default: nodejs-app-demo

  steps:
    - id: fetch-base
      name: Rendering Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: '{{ parameters.component_id }}'
          description: '{{ parameters.description }}'
          owner: '{{ parameters.owner }}'
          system: '{{ parameters.system }}'
          destinationOwner: '{{ parameters.destinationOwner }}'

    - id: publish
      name: Publishing Repository to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: '{{ parameters.description }}'
        repoUrl: 'github.com?owner={{ parameters.destinationOwner }}&repo={{ parameters.repository }}'
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Registering in Backstage
      action: catalog:register
      input:
        repoContentsUrl: '{{ steps.publish.output.repoContentsUrl }}'
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Open Git Repository
        url: '{{ steps.publish.output.remoteUrl }}'
      - title: View in Backstage Catalog
        icon: catalog
        entityRef: '{{ steps.register.output.entityRef }}'
