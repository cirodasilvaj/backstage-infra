name: terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "k8s-manifests/**"
      - "templates/**"
      - "db/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "k8s-manifests/**"
      - "db/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: apply

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_VAR_github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: tf-backstage-infra
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync GitHub Secrets to AWS SSM Parameter Store
        working-directory: .
        env:
          GH_APP_ID_SECRET: ${{ secrets.GH_APP_ID }}
          GH_APP_CLIENT_ID_SECRET: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_CLIENT_SECRET_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GH_APP_WEBHOOK_SECRET_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GH_APP_PRIVATE_KEY_SECRET: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID_SECRET: ${{ secrets.GH_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          echo "Syncing GitHub Actions Secrets to AWS SSM Parameter Store..."
          if [ -n "$GH_APP_ID_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/app_id" --value "$GH_APP_ID_SECRET" --type "SecureString" --overwrite || true
          fi
          if [ -n "$GH_APP_CLIENT_ID_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/client_id" --value "$GH_APP_CLIENT_ID_SECRET" --type "SecureString" --overwrite || true
          fi
          if [ -n "$GH_APP_CLIENT_SECRET_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/client_secret" --value "$GH_APP_CLIENT_SECRET_SECRET" --type "SecureString" --overwrite || true
          fi
          if [ -n "$GH_APP_WEBHOOK_SECRET_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/webhook_secret" --value "$GH_APP_WEBHOOK_SECRET_SECRET" --type "SecureString" --overwrite || true
          fi
          if [ -n "$GH_APP_PRIVATE_KEY_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/private_key" --value "$GH_APP_PRIVATE_KEY_SECRET" --type "SecureString" --overwrite || true
          fi
          if [ -n "$GH_APP_INSTALLATION_ID_SECRET" ]; then
            aws ssm put-parameter --name "/backstage/github/installation_id" --value "$GH_APP_INSTALLATION_ID_SECRET" --type "SecureString" --overwrite || true
          fi
          echo "GitHub Secrets sync complete."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Ensure state bucket
        working-directory: .
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="backstage-infra-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket ${BUCKET} already exists."
          else
            echo "Creating state bucket ${BUCKET} ..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="${REGION}"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          aws s3 rm "s3://${BUCKET}/backstage-infra/terraform.tfstate.tflock" 2>/dev/null || true

      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=backstage-infra/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Pre-install ArgoCD CRDs and ensure backstage namespace
        run: |
          aws eks update-kubeconfig --name "kube-demo-eks" --region "${AWS_REGION:-${{ secrets.AWS_REGION || 'us-east-1' }}}"
          kubectl apply -k https://github.com/argoproj/argo-cd/manifests/crds\?ref=v2.12.3
          for crd in applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io; do
            kubectl label crd "$crd" app.kubernetes.io/managed-by=Helm --overwrite || true
            kubectl annotate crd "$crd" meta.helm.sh/release-name=argocd meta.helm.sh/release-namespace=argocd --overwrite || true
          done
          kubectl create namespace backstage --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace sonarqube --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret -n argocd sh.helm.release.v1.argocd.v2 sh.helm.release.v1.argocd.v3 --ignore-not-found || true
          kubectl delete job -n argocd --all --ignore-not-found || true
          terraform import module.grafana.kubernetes_namespace.grafana grafana 2>/dev/null || true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform run
        run: |
          set -euo pipefail
          ACTION="${{ github.event_name == 'push' && 'apply' || github.event.inputs.action || 'plan' }}"
          case "$ACTION" in
            plan)
              terraform plan -input=false ;;
            apply)
              terraform apply -input=false -auto-approve ;;
            destroy)
              terraform destroy -input=false -auto-approve ;;
            *)
              echo "unknown action: $ACTION" >&2; exit 1 ;;
          esac

      - name: Sync Backstage manifests and show outputs
        if: github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == ''
        env:
          GH_PAT_SECRET: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_APP_ID_SECRET: ${{ secrets.GH_APP_ID }}
          GH_APP_CLIENT_ID_SECRET: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_CLIENT_SECRET_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GH_APP_WEBHOOK_SECRET_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GH_APP_PRIVATE_KEY_SECRET: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          kubectl apply -f ../k8s-manifests/backstage/

          # 1. Recupera credenciais do GitHub Actions Secrets com fallback no AWS SSM Parameter Store
          APP_ID="${GH_APP_ID_SECRET}"
          [ -z "$APP_ID" ] && APP_ID=$(aws ssm get-parameter --name "/backstage/github/app_id" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")

          CLIENT_ID="${GH_APP_CLIENT_ID_SECRET}"
          [ -z "$CLIENT_ID" ] && CLIENT_ID=$(aws ssm get-parameter --name "/backstage/github/client_id" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")

          CLIENT_SECRET="${GH_APP_CLIENT_SECRET_SECRET}"
          [ -z "$CLIENT_SECRET" ] && CLIENT_SECRET=$(aws ssm get-parameter --name "/backstage/github/client_secret" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")

          WEBHOOK_SECRET="${GH_APP_WEBHOOK_SECRET_SECRET}"
          [ -z "$WEBHOOK_SECRET" ] && WEBHOOK_SECRET=$(aws ssm get-parameter --name "/backstage/github/webhook_secret" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "development-webhook-secret")

          if [ -n "${GH_APP_PRIVATE_KEY_SECRET}" ]; then
            PRIVATE_KEY="${GH_APP_PRIVATE_KEY_SECRET}"
          else
            PRIVATE_KEY=$(aws ssm get-parameter --name "/backstage/github/private_key" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi

          TOKEN="${GH_PAT_SECRET}"

          # 2. Configura Secret permanente no cluster Kubernetes
          kubectl create secret generic backstage-github-credentials \
            --namespace backstage \
            --from-literal=token="$TOKEN" \
            --from-literal=app_id="$APP_ID" \
            --from-literal=client_id="$CLIENT_ID" \
            --from-literal=client_secret="$CLIENT_SECRET" \
            --from-literal=webhook_secret="$WEBHOOK_SECRET" \
            --from-literal=private_key="$PRIVATE_KEY" \
            --from-literal=GITHUB_APP_APP_ID="$APP_ID" \
            --from-literal=GITHUB_APP_CLIENT_ID="$CLIENT_ID" \
            --from-literal=GITHUB_APP_CLIENT_SECRET="$CLIENT_SECRET" \
            --from-literal=GITHUB_APP_WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --from-literal=GITHUB_APP_PRIVATE_KEY="$PRIVATE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ../k8s-manifests/sonarqube/
          kubectl delete deployment grafana-metrics -n grafana --ignore-not-found || true
          kubectl apply -f ../k8s-manifests/grafana/
          kubectl rollout status deployment/grafana-metrics -n grafana --timeout=120s || true
          kubectl rollout restart deployment/backstage -n backstage
          kubectl rollout status deployment/backstage -n backstage --timeout=180s || true
          terraform output
          echo "--- ARGOCD INITIAL ADMIN PASSWORD ---"
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d && echo "" || true
          echo "--- DEPLOYING SAMBA 4 AD + FREERADIUS MFA + KEYCLOAK IN EKS VPC ---"
          rm -rf /tmp/samba-ad-keycloak
          git clone https://github.com/cirodasilvaj/samba-ad-keycloak.git /tmp/samba-ad-keycloak
          cd /tmp/samba-ad-keycloak/terraform
          aws s3 rm "s3://${STATE_BUCKET}/samba-ad-keycloak/terraform.tfstate.tflock" 2>/dev/null || true
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=samba-ad-keycloak/terraform.tfstate" \
            -backend-config="region=${AWS_REGION:-${{ secrets.AWS_REGION || 'us-east-1' }}}" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve
          kubectl apply -f ../k8s/eks-iam-integration.yaml || true
          echo "--- SAMBA 4 AD + FREERADIUS + KEYCLOAK OUTPUTS ---"
          terraform output
          echo "--- CLUSTER PODS ---"
          kubectl get pods -A
          echo "--- CLUSTER SERVICES ---"
          kubectl get svc -A
          echo "=============================================================================="
          echo "🔒 AWS SYSTEMS MANAGER PARAMETER STORE (SINGLE SOURCE OF TRUTH)"
          echo "=============================================================================="
          echo "Recurso Parameter Store: /kube-demo-2026/platform/credentials"
          echo "Tipo: SecureString (Criptografado com AWS KMS)"
          echo ""
          echo "Comando para resgatar todos os endpoints, URLs e credenciais:"
          echo "aws ssm get-parameter --name '/kube-demo-2026/platform/credentials' --with-decryption --query 'Parameter.Value' --output text | jq ."
          echo "=============================================================================="
          cd "$GITHUB_WORKSPACE/terraform"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "lab")
            echo "### 🔒 AWS Systems Manager Parameter Store (Central de Credenciais & URLs)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Todas as URLs dos serviços, endpoints do Route 53, certificados e senhas foram armazenados em um recurso único e seguro no **AWS Parameter Store**, eliminando a exposição de credenciais em texto plano nos logs." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Nome do Recurso no AWS Parameter Store:** \`/kube-demo-2026/platform/credentials\`" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Tipo de Armazenamento:** \`SecureString\` (KMS)" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Conta AWS:** \`${ACCOUNT_ID}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Como recuperar com segurança via AWS CLI:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
            echo "aws ssm get-parameter \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --name '/kube-demo-2026/platform/credentials' \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --with-decryption \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --query 'Parameter.Value' \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --output text | jq ." >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true
